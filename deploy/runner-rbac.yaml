apiVersion: v1
kind: ServiceAccount
metadata:
  name: rsoi04-runner
---
apiVersion: v1
kind: Secret
metadata:
  name: rsoi04-runner-token
  annotations:
    kubernetes.io/service-account.name: rsoi04-runner
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rsoi04-runner
rules:
  - apiGroups: [""]
    resources: [secrets, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, update, patch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets, statefulsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rsoi04-runner
subjects:
  - kind: ServiceAccount
    name: rsoi04-runner
    namespace: test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rsoi04-runner
